<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="rpr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    
    <!-- Shield Gradient -->
    <linearGradient id="rpr-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Fold Corner Gradient -->
    <linearGradient id="rpr-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="rpr-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>

    <filter id="sheet-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container with Shadow -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#rpr-bg)" filter="url(#rpr-shadow)"/>
  <!-- Inner Highlight Rim -->
  <rect x="9" y="9" width="110" height="110" rx="27" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- PDF Document Page Shape with Folded Corner -->
  <g filter="url(#sheet-shadow)">
    <!-- Document Body -->
    <path d="M40 28C36.6863 28 34 30.6863 34 34V94C34 97.3137 36.6863 100 40 100H88C91.3137 100 94 97.3137 94 94V48L74 28H40Z" fill="#ffffff"/>
    
    <!-- Folded Corner -->
    <path d="M74 28V44C74 46.2091 75.7909 48 78 48H94L74 28Z" fill="url(#rpr-fold)"/>
  </g>

  <!-- Decorative Document Lines -->
  <rect x="44" y="42" width="22" height="3.5" rx="1.75" fill="#e2e8f0"/>
  <rect x="44" y="50" width="34" height="3.5" rx="1.75" fill="#e2e8f0"/>
  
  <!-- Shield Emblem (Privacy Guaranteed) -->
  <g transform="translate(0, 4)">
    <path d="M64 56C72.5 56 79 62.5 79 71C79 83.5 64 92 64 92C64 92 49 83.5 49 71C49 62.5 55.5 56 64 56Z" fill="url(#rpr-shield)"/>
    <!-- Shield Checkmark -->
    <path d="M59 71.5L62.5 75L69 67.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
